name: CI / Watchtower
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-fund --no-audit
      - name: Typecheck
        run: npm run check
      - name: Test
        run: npm run test
      - name: Sentinel offline tests
        run: npm run test:sentinel
      - name: Minotaur runner argument tests (no Docker execution)
        run: npm run test:minotaur
      - name: Build
        run: npm run build
