name: CI / Watchtower
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --no-fund --no-audit
      - name: Verify committed npm lockfile and registry integrity metadata
        run: npm run provenance:verify
      - name: Provenance inventory unit tests
        run: npm run test:provenance
      - name: Typecheck
        run: npm run check
      - name: Test
        run: npm run test
      - name: Sentinel offline tests
        run: npm run test:sentinel
      - name: Minotaur runner argument tests (no Docker execution)
        run: npm run test:minotaur
      - name: Independent signed evidence checks
        run: |
          npm run test:evidence
          npm run evidence:verify
      - name: Release Guardian policy unit tests (advisory only)
        run: npm run test:guardian
      - name: Artifact Witness mutation tests (offline)
        run: npm run test:artifact
      - name: Attestation workflow safety checks (offline)
        run: npm run test:attestation
      - name: Post-deploy reconciliation negative controls (offline)
        run: npm run test:custody
      - name: Build
        run: npm run build
      - name: Stamp and verify exact built files
        run: |
          npm run artifact:stamp
          npm run artifact:verify
