name: Deploy / GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *' # daily 13:17 UTC; subject is this repo only
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      manifest_sha256: ${{ steps.expected.outputs.sha256 }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Verify committed lockfile
        run: npm run provenance:verify
      - name: Verify
        run: |
          npm run check
          npm run test
          npm run test:sentinel
          npm run test:minotaur
          npm run test:evidence
          npm run evidence:verify
          npm run test:guardian
          npm run test:provenance
          npm run test:artifact
          npm run test:attestation
          npm run test:custody
          npm run test:incident
          npm run test:recovery
          npm run test:plur
          npm run plur:check
      - name: Generate unsigned, source-linked lockfile inventory
        run: npm run provenance:report
      - name: Generate scoped OSV report (failure = UNKNOWN, not green)
        run: npm run sentinel:scan
      - name: Generate advisory Release Guardian posture (non-blocking)
        run: npm run guardian:report
      - name: Publish unsigned R13 PLUR source observation
        run: npm run plur:report
      - name: Build static application
        run: npm run build
      - name: Fingerprint completed static build and verify each file
        run: |
          npm run artifact:stamp
          npm run artifact:verify
      - name: Record exact expected manifest digest for post-deploy reconciliation
        id: expected
        shell: bash
        run: |
          set -eu
          echo "sha256=$(sha256sum dist/artifact-manifest.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      # R9: Only this main/scheduled/dispatch Pages build may request
      # a short-lived GitHub OIDC certificate for the completed manifest.
      # The signed subject is the R8 byte inventory, not an assertion
      # that all deployed assets are free of vulnerabilities.
      - name: Publish GitHub Sigstore provenance for build manifest
        uses: actions/attest@v4
        with:
          subject-path: dist/artifact-manifest.json
      - name: Verify issued attestation against workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for attempt in 1 2 3; do
            if gh attestation verify dist/artifact-manifest.json \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/pages.yml" \
              --source-ref refs/heads/main; then
              echo "R9 attestation verified by GitHub CLI."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          echo "R9 attestation verification FAILED. Refusing Pages upload." >&2
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  custody:
    name: Post-deploy public chain of custody
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile attested manifest with actual hosted assets
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/custody-verify.mjs
      - name: Produce advisory R11 incident packet and recovery steps
        if: always()
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: node scripts/incident.mjs
      - name: Retain unsigned custody and incident evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postdeploy-custody-observation
          path: |
            custody-report.json
            incident-report.json
          if-no-files-found: ignore
          retention-days: 30
